# One-off: copies the header image of the old Google Sites page into the repo.
name: Import old site image

on:
  push:
    branches: [ccr-af5c933e-vi0hi6]
    paths: [.github/workflows/import-old-site-image.yml]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download header image
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36'
          # Image links on Google Sites are short-lived, so read a fresh one from the live page.
          for PAGE in https://joaoeiro.pt/ https://sites.google.com/view/joaoeiro/inicio; do
            curl -fsSL -A "$UA" -o page.html "$PAGE" || continue
            URL=$(grep -oE 'IFuOkc" style="background-position: center center; background-image: url\(https://sites\.google\.com/sitesv-images-rt/[^)]+\)' page.html \
              | head -1 | sed -E 's/.*url\((.*)\)/\1/; s/=w[0-9]+$//') || true
            [ -n "${URL:-}" ] && break
          done
          [ -n "${URL:-}" ] || { echo 'Header image not found'; exit 1; }
          echo "Header image: $URL"
          mkdir -p src/assets
          curl -fsSL -A "$UA" -e "$PAGE" -D headers.txt -o img.bin "${URL}=w2400"
          TYPE=$(grep -i '^content-type:' headers.txt | tail -1 | tr -d '\r' | awk '{print $2}')
          case "$TYPE" in
            image/jpeg) EXT=jpg ;; image/png) EXT=png ;; image/webp) EXT=webp ;; *) echo "Unexpected type: $TYPE"; exit 1 ;;
          esac
          mv img.bin "src/assets/hero-old-site.$EXT"
          file "src/assets/hero-old-site.$EXT"
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/assets
          git commit -m 'Import header image from the old joaoeiro.pt'
          git push
